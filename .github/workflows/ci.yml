name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r requirements.bot.txt
          pip install pytest fastapi uvicorn
      - name: Syntax check
        run: |
          python -m compileall bot api -q
      - name: Pytest
        env:
          BOT_TOKEN: "123456:CI_TEST_TOKEN"
          ADMIN_ID: "1"
        run: |
          pytest tests/ -q --tb=short
      - name: JS syntax
        run: |
          node --check miniapp/js/core.js || true
          node --check miniapp/js/news.js || true
          node --check miniapp/js/charts.js || true
