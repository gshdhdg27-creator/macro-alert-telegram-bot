name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.bot.txt

      - name: Python syntax
        run: python -m compileall bot api -q

      - name: Pytest
        env:
          BOT_TOKEN: "123456:CI_TEST_TOKEN"
          ADMIN_ID: "1"
          PYTHONPATH: "${{ github.workspace }}"
        run: python -m pytest tests/ -q --tb=short

      - name: JavaScript syntax
        run: |
          node --check miniapp/js/core.js
          node --check miniapp/js/news.js
          node --check miniapp/js/charts.js
          node --check miniapp/js/api.js
