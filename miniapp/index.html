<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/><title>Macro Alert</title><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script><script>tailwind.config={theme:{extend:{colors:{dark:{950:'#0a0a0b',900:'#111113',800:'#1a1a1e',700:'#242428',600:'#2e2e33'},gold:{400:'#f5c542',500:'#e8b923',600:'#d4a017'},accent:{cyan:'#22d3ee',green:'#34d399',red:'#f87171'}},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;background:#0a0a0b;color:#f4f4f5;margin:0;overscroll-behavior:none}.card{background:linear-gradient(145deg,#1a1a1e,#141416);border:1px solid rgba(255,255,255,.06)}.tab-active{background:linear-gradient(135deg,#e8b923,#d4a017);color:#0a0a0b;font-weight:600}.tf-active{background:#e8b923;color:#0a0a0b;font-weight:600}.price-up{color:#34d399}.price-down{color:#f87171}.scrollbar-hide::-webkit-scrollbar{display:none}#chart-container{width:100%;height:320px}</style></head><body class="min-h-screen bg-dark-950 text-zinc-100"><div id="app-main"><header class="sticky top-0 z-50 bg-dark-950/90 backdrop-blur-xl border-b border-white/5 px-4 pt-3 pb-3"><div class="flex items-center justify-between"><div class="flex items-center gap-2.5"><div class="w-9 h-9 rounded-xl bg-gradient-to-br from-gold-400 to-gold-600 flex items-center justify-center text-dark-950 font-bold text-lg">M</div><div><h1 class="text-[15px] font-semibold">Macro Alert</h1><p class="text-[11px] text-zinc-500">Real-time macro & assets</p></div></div><button id="btn-quiet" onclick="toggleQuiet()" class="px-3 py-1.5 rounded-full text-xs font-medium bg-dark-800 border border-white/10 text-zinc-300">🔔 Алерты</button></div></header><main class="px-4 pt-4 pb-28"><div class="flex gap-1 p-1 bg-dark-900 rounded-2xl mb-5"><button onclick="switchTab('home')" id="tab-home" class="tab-active flex-1 py-2 rounded-xl text-xs">Главная</button><button onclick="switchTab('news')" id="tab-news" class="flex-1 py-2 rounded-xl text-xs text-zinc-400">Новости</button><button onclick="switchTab('calendar')" id="tab-calendar" class="flex-1 py-2 rounded-xl text-xs text-zinc-400">Календарь</button><button onclick="switchTab('settings')" id="tab-settings" class="flex-1 py-2 rounded-xl text-xs text-zinc-400">Настройки</button></div><div id="view-home"><div class="card rounded-2xl p-4 mb-4"><div class="flex items-center justify-between mb-3"><span class="text-xs text-zinc-500 uppercase">Статус</span><span class="flex items-center gap-1.5 text-xs text-accent-green"><span class="w-1.5 h-1.5 rounded-full bg-accent-green animate-pulse"></span> Онлайн</span></div><p class="text-sm text-zinc-300">Мониторинг 13 активов + Forex Factory</p></div><h2 class="text-xs font-medium text-zinc-500 uppercase mb-3">Активы</h2><div class="grid grid-cols-2 gap-2.5 mb-6" id="assets-grid"></div></div><div id="view-news" class="hidden"><div class="flex items-center justify-between mb-3"><div><h2 class="text-sm font-semibold">Forex Factory</h2><p class="text-[11px] text-zinc-500" id="news-updated">Загрузка…</p></div><button onclick="loadNews(true)" class="px-3 py-1.5 rounded-lg text-xs bg-dark-800 text-zinc-300">Обновить</button></div><div class="flex gap-1.5 mb-3 overflow-x-auto scrollbar-hide"><button onclick="filterNews('all',this)" class="news-filter tab-active px-3 py-1 rounded-full text-xs">Все</button><button onclick="filterNews('High',this)" class="news-filter px-3 py-1 rounded-full text-xs text-zinc-400 bg-dark-800">High</button><button onclick="filterNews('Medium',this)" class="news-filter px-3 py-1 rounded-full text-xs text-zinc-400 bg-dark-800">Medium</button><button onclick="filterNews('Low',this)" class="news-filter px-3 py-1 rounded-full text-xs text-zinc-400 bg-dark-800">Low</button></div><div id="news-list" class="space-y-2.5"><p class="text-sm text-zinc-500 text-center py-8">Загрузка новостей…</p></div></div><div id="view-calendar" class="hidden"><div class="flex gap-2 mb-4"><button onclick="setPeriod(this)" class="period-btn tab-active px-4 py-2 rounded-full text-sm">Сегодня</button><button onclick="setPeriod(this)" class="period-btn px-4 py-2 rounded-full text-sm text-zinc-400 bg-dark-800">Завтра</button><button onclick="setPeriod(this)" class="period-btn px-4 py-2 rounded-full text-sm text-zinc-400 bg-dark-800">Неделя</button></div><div class="space-y-3" id="calendar-static"><p class="text-xs text-zinc-500">Смотри полный список во вкладке Новости (данные Forex Factory).</p></div></div><div id="view-settings" class="hidden"><div class="card rounded-2xl p-4 mb-4"><div class="flex items-center justify-between mb-4"><div><p class="text-sm font-medium">Только High Impact</p></div><button id="toggle-high" onclick="toggleHigh()" class="w-12 h-7 rounded-full bg-dark-600 relative"><span class="absolute top-0.5 left-0.5 w-6 h-6 rounded-full bg-white shadow"></span></button></div></div><h2 class="text-xs font-medium text-zinc-500 uppercase mb-3">Подписки</h2><div class="flex flex-wrap gap-2" id="subscribe-chips"></div></div></main></div><div id="app-asset" class="hidden fixed inset-0 z-50 bg-dark-950 flex flex-col"><div class="px-4 pt-3 pb-2 border-b border-white/5 flex items-center gap-3"><button onclick="closeAsset()" class="w-9 h-9 rounded-xl bg-dark-800 flex items-center justify-center">←</button><div class="flex-1"><div class="flex items-center gap-2"><span id="asset-emoji" class="text-xl"></span><span id="asset-symbol" class="font-semibold text-[15px]"></span></div><p id="asset-fullname" class="text-[11px] text-zinc-500"></p></div><div class="text-right"><p id="asset-price" class="font-mono font-semibold text-[15px]">—</p><p id="asset-change" class="text-xs font-medium">—</p></div></div><div class="px-3 py-2 flex gap-1.5 overflow-x-auto scrollbar-hide border-b border-white/5"><button onclick="setTf(this,'1s')" class="tf-btn px-2.5 py-1 rounded-lg text-xs text-zinc-400 bg-dark-800">1s</button><button onclick="setTf(this,'5s')" class="tf-btn px-2.5 py-1 rounded-lg text-xs text-zinc-400 bg-dark-800">5s</button><button onclick="setTf(this,'1m')" class="tf-btn tf-active px-2.5 py-1 rounded-lg text-xs">1m</button><button onclick="setTf(this,'5m')" class="tf-btn px-2.5 py-1 rounded-lg text-xs text-zinc-400 bg-dark-800">5m</button><button onclick="setTf(this,'15m')" class="tf-btn px-2.5 py-1 rounded-lg text-xs text-zinc-400 bg-dark-800">15m</button><button onclick="setTf(this,'1h')" class="tf-btn px-2.5 py-1 rounded-lg text-xs text-zinc-400 bg-dark-800">1h</button><button onclick="setTf(this,'1d')" class="tf-btn px-2.5 py-1 rounded-lg text-xs text-zinc-400 bg-dark-800">1D</button></div><div class="px-3 py-2 flex gap-2 border-b border-white/5"><button onclick="setChartType('candles')" id="btn-candles" class="px-3 py-1 rounded-lg text-xs font-medium bg-gold-500 text-dark-950">Свечи</button><button onclick="setChartType('line')" id="btn-line" class="px-3 py-1 rounded-lg text-xs font-medium bg-dark-800 text-zinc-400">Линия</button><div class="flex-1"></div><span id="live-indicator" class="text-[11px] text-zinc-500 self-center">● Live</span></div><div id="chart-container" class="flex-1"></div><div class="px-4 py-3 border-t border-white/5 grid grid-cols-3 gap-3 text-center"><div><p class="text-[10px] text-zinc-500">Open</p><p id="stat-open" class="font-mono text-sm">—</p></div><div><p class="text-[10px] text-zinc-500">High</p><p id="stat-high" class="font-mono text-sm text-accent-green">—</p></div><div><p class="text-[10px] text-zinc-500">Low</p><p id="stat-low" class="font-mono text-sm text-accent-red">—</p></div></div></div><script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();tg.setHeaderColor('#0a0a0b');tg.setBackgroundColor('#0a0a0b');}
const ASSETS=[{key:'xauusd',emoji:'🟡',name:'XAUUSD',full:'Золото',binance:null,base:2650},{key:'nasdaq',emoji:'📈',name:'NASDAQ',full:'NASDAQ 100',binance:null,base:20500},{key:'sp500',emoji:'📊',name:'S&P 500',full:'S&P 500',binance:null,base:5800},{key:'btc',emoji:'🪙',name:'BTC',full:'Bitcoin',binance:'BTCUSDT',base:67000},{key:'eth',emoji:'💎',name:'ETH',full:'Ethereum',binance:'ETHUSDT',base:3500},{key:'dxy',emoji:'💵',name:'DXY',full:'Dollar Index',binance:null,base:104.5},{key:'oil',emoji:'🛢',name:'OIL',full:'Brent/WTI',binance:null,base:78},{key:'eurusd',emoji:'💶',name:'EURUSD',full:'EUR/USD',binance:null,base:1.085},{key:'gbpusd',emoji:'💷',name:'GBPUSD',full:'GBP/USD',binance:null,base:1.305},{key:'usdjpy',emoji:'💴',name:'USDJPY',full:'USD/JPY',binance:null,base:149.5},{key:'agro',emoji:'🌾',name:'AGRO',full:'Commodities',binance:null,base:580},{key:'tesla',emoji:'🚗',name:'TSLA',full:'Tesla',binance:null,base:250},{key:'ai_tech',emoji:'🤖',name:'NVDA',full:'AI & Chips',binance:null,base:140}];
let quiet=false,onlyHigh=false,subscribed=Object.fromEntries(ASSETS.map(a=>[a.key,true]));
let currentAsset=null,chart=null,candleSeries=null,lineSeries=null,chartType='candles',currentTf='1m',priceInterval=null,ws=null,lastCandle=null,allNews=[],newsFilter='all',newsTimer=null;
function renderAssets(){document.getElementById('assets-grid').innerHTML=ASSETS.map(a=>`<button onclick="openAsset('${a.key}')" class="card rounded-2xl p-3.5 text-left"><div class="text-2xl mb-1.5">${a.emoji}</div><div class="text-sm font-semibold">${a.name}</div><div class="text-[11px] text-zinc-500">${a.full}</div></button>`).join('');}
function renderChips(){document.getElementById('subscribe-chips').innerHTML=ASSETS.map(a=>`<button onclick="toggleSub('${a.key}')" class="px-3 py-1.5 rounded-full text-xs ${subscribed[a.key]?'bg-gold-500/20 text-gold-400 border border-gold-500/40':'bg-dark-800 text-zinc-400'}">${a.emoji} ${a.name}</button>`).join('');}
function switchTab(tab){['home','news','calendar','settings'].forEach(t=>{document.getElementById('view-'+t).classList.toggle('hidden',t!==tab);document.getElementById('tab-'+t).className=t===tab?'tab-active flex-1 py-2 rounded-xl text-xs':'flex-1 py-2 rounded-xl text-xs text-zinc-400';});if(tg)tg.HapticFeedback?.impactOccurred('light');if(tab==='news'){loadNews();if(newsTimer)clearInterval(newsTimer);newsTimer=setInterval(()=>loadNews(),45000);}else if(newsTimer){clearInterval(newsTimer);newsTimer=null;}}
function setPeriod(btn){document.querySelectorAll('.period-btn').forEach(b=>b.className='period-btn px-4 py-2 rounded-full text-sm text-zinc-400 bg-dark-800');btn.className='period-btn tab-active px-4 py-2 rounded-full text-sm';}
function toggleQuiet(){quiet=!quiet;const b=document.getElementById('btn-quiet');b.textContent=quiet?'🔇 Тихий':'🔔 Алерты';b.className=quiet?'px-3 py-1.5 rounded-full text-xs font-medium bg-red-500/20 border border-red-500/30 text-red-400':'px-3 py-1.5 rounded-full text-xs font-medium bg-dark-800 border border-white/10 text-zinc-300';}
function toggleHigh(){onlyHigh=!onlyHigh;const t=document.getElementById('toggle-high'),k=t.querySelector('span');if(onlyHigh){t.classList.add('bg-gold-500');k.style.transform='translateX(20px)';}else{t.classList.remove('bg-gold-500');k.style.transform='translateX(0)';}}
function toggleSub(key){subscribed[key]=!subscribed[key];renderChips();}
async function loadNews(manual){const list=document.getElementById('news-list');if(manual)list.innerHTML='<p class="text-sm text-zinc-500 text-center py-6">Обновление…</p>';try{const res=await fetch('https://pipatlas.com/api/calendar',{cache:'no-store'});const data=await res.json();allNews=data.events||[];const upd=data.updated?new Date(data.updated):new Date();document.getElementById('news-updated').textContent='Обновлено: '+upd.toLocaleString('ru-RU',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'})+' · '+allNews.length+' событий';renderNews();}catch(e){list.innerHTML='<p class="text-sm text-red-400 text-center py-6">Ошибка. Нажми Обновить.</p>';}}
function filterNews(level,btn){newsFilter=level;document.querySelectorAll('.news-filter').forEach(b=>b.className='news-filter px-3 py-1 rounded-full text-xs text-zinc-400 bg-dark-800');if(btn)btn.className='news-filter tab-active px-3 py-1 rounded-full text-xs';renderNews();}
function impactStars(imp){if(imp==='High')return'<span class="text-red-400">⭐️⭐️⭐️</span>';if(imp==='Medium')return'<span class="text-gold-400">⭐️⭐️</span>';if(imp==='Holiday')return'<span class="text-zinc-500">🏖</span>';return'<span class="text-zinc-500">⭐️</span>';}
function renderNews(){const list=document.getElementById('news-list');let items=newsFilter==='all'?allNews:allNews.filter(e=>e.impact===newsFilter);if(!items.length){list.innerHTML='<p class="text-sm text-zinc-500 text-center py-8">Нет событий</p>';return;}items=[...items].sort((a,b)=>new Date(a.date)-new Date(b.date));list.innerHTML=items.map(e=>{const d=new Date(e.date);const timeStr=d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});return`<div class="card rounded-2xl p-3.5"><div class="flex items-center gap-2 mb-1.5">${impactStars(e.impact)}<span class="text-xs font-medium text-zinc-400">${e.currency||''}</span><span class="ml-auto text-[11px] text-zinc-500">${timeStr}</span></div><p class="text-sm font-semibold">${e.name||''}</p>${e.impact!=='Holiday'?`<div class="flex gap-3 mt-2 text-[11px]"><div><span class="text-zinc-500">Actual</span><br><span class="font-mono">${e.actual||'—'}</span></div><div><span class="text-zinc-500">Forecast</span><br><span class="font-mono text-gold-400">${e.forecast||'—'}</span></div><div><span class="text-zinc-500">Prev</span><br><span class="font-mono text-zinc-400">${e.previous||'—'}</span></div></div>`:''}</div>`;}).join('');}
function openAsset(key){currentAsset=ASSETS.find(a=>a.key===key);if(!currentAsset)return;document.getElementById('app-main').classList.add('hidden');document.getElementById('app-asset').classList.remove('hidden');document.getElementById('asset-emoji').textContent=currentAsset.emoji;document.getElementById('asset-symbol').textContent=currentAsset.name;document.getElementById('asset-fullname').textContent=currentAsset.full;if(tg){tg.BackButton.show();tg.BackButton.onClick(closeAsset);}initChart();loadChartData();startLivePrice();}
function closeAsset(){stopLive();if(chart){chart.remove();chart=null;candleSeries=null;lineSeries=null;}document.getElementById('app-asset').classList.add('hidden');document.getElementById('app-main').classList.remove('hidden');if(tg)tg.BackButton.hide();}
function initChart(){const c=document.getElementById('chart-container');c.innerHTML='';chart=LightweightCharts.createChart(c,{layout:{background:{type:'solid',color:'#0a0a0b'},textColor:'#a1a1aa'},grid:{vertLines:{color:'rgba(255,255,255,0.04)'},horzLines:{color:'rgba(255,255,255,0.04)'}},rightPriceScale:{borderColor:'rgba(255,255,255,0.08)'},timeScale:{borderColor:'rgba(255,255,255,0.08)',timeVisible:true,secondsVisible:true},handleScroll:{vertTouchDrag:false}});candleSeries=chart.addCandlestickSeries({upColor:'#34d399',downColor:'#f87171',borderUpColor:'#34d399',borderDownColor:'#f87171',wickUpColor:'#34d399',wickDownColor:'#f87171'});lineSeries=chart.addLineSeries({color:'#e8b923',lineWidth:2,visible:false});new ResizeObserver(e=>{if(e[0]&&chart){const{width,height}=e[0].contentRect;chart.applyOptions({width,height});}}).observe(c);}
function generateCandles(base,count,tfSec){const now=Math.floor(Date.now()/1000);const data=[];let price=base*(0.98+Math.random()*0.04);for(let i=count;i>=0;i--){const time=now-i*tfSec;const open=price;const change=(Math.random()-0.48)*base*0.003;const close=open+change;const high=Math.max(open,close)+Math.random()*base*0.001;const low=Math.min(open,close)-Math.random()*base*0.001;data.push({time,open,high,low,close});price=close;}return data;}
function tfToSeconds(tf){return{'1s':1,'5s':5,'10s':10,'1m':60,'5m':300,'15m':900,'1h':3600,'4h':14400,'1d':86400}[tf]||60;}
function loadChartData(){if(!currentAsset||!chart)return;const tfSec=tfToSeconds(currentTf);const count=currentTf==='1s'||currentTf==='5s'?120:150;const candles=generateCandles(currentAsset.base,count,tfSec);candleSeries.setData(candles);lineSeries.setData(candles.map(c=>({time:c.time,value:c.close})));const last=candles[candles.length-1];updatePriceUI(last.close,candles[0].open);document.getElementById('stat-open').textContent=formatPrice(last.open);document.getElementById('stat-high').textContent=formatPrice(last.high);document.getElementById('stat-low').textContent=formatPrice(last.low);chart.timeScale().fitContent();}
function setTf(btn,tf){currentTf=tf;document.querySelectorAll('.tf-btn').forEach(b=>b.className='tf-btn px-2.5 py-1 rounded-lg text-xs text-zinc-400 bg-dark-800');btn.className='tf-btn tf-active px-2.5 py-1 rounded-lg text-xs';loadChartData();}
function setChartType(type){chartType=type;if(type==='candles'){candleSeries.applyOptions({visible:true});lineSeries.applyOptions({visible:false});document.getElementById('btn-candles').className='px-3 py-1 rounded-lg text-xs font-medium bg-gold-500 text-dark-950';document.getElementById('btn-line').className='px-3 py-1 rounded-lg text-xs font-medium bg-dark-800 text-zinc-400';}else{candleSeries.applyOptions({visible:false});lineSeries.applyOptions({visible:true});document.getElementById('btn-line').className='px-3 py-1 rounded-lg text-xs font-medium bg-gold-500 text-dark-950';document.getElementById('btn-candles').className='px-3 py-1 rounded-lg text-xs font-medium bg-dark-800 text-zinc-400';}}
function formatPrice(p){if(p>=1000)return p.toFixed(1);if(p>=10)return p.toFixed(2);if(p>=1)return p.toFixed(4);return p.toFixed(5);}
function updatePriceUI(price,prev){document.getElementById('asset-price').textContent=formatPrice(price);const pct=((price-prev)/prev*100);const ch=document.getElementById('asset-change');ch.textContent=(pct>=0?'+':'')+pct.toFixed(2)+'%';ch.className='text-xs font-medium '+(pct>=0?'price-up':'price-down');}
function startLivePrice(){stopLive();lastCandle=null;function tick(price){if(!currentAsset||!candleSeries)return;const prev=currentAsset.base;currentAsset.base=price;updatePriceUI(price,prev);const tfSec=tfToSeconds(currentTf);const now=Math.floor(Date.now()/1000);const candleTime=Math.floor(now/tfSec)*tfSec;if(!lastCandle||lastCandle.time!==candleTime){lastCandle={time:candleTime,open:price,high:price,low:price,close:price};}else{lastCandle.close=price;lastCandle.high=Math.max(lastCandle.high,price);lastCandle.low=Math.min(lastCandle.low,price);}try{candleSeries.update(lastCandle);if(lineSeries)lineSeries.update({time:lastCandle.time,value:lastCandle.close});document.getElementById('stat-high').textContent=formatPrice(lastCandle.high);document.getElementById('stat-low').textContent=formatPrice(lastCandle.low);}catch(e){}}if(currentAsset.binance){ws=new WebSocket('wss://stream.binance.com:9443/ws/'+currentAsset.binance.toLowerCase()+'@trade');ws.onmessage=ev=>{tick(parseFloat(JSON.parse(ev.data).p));};document.getElementById('live-indicator').textContent='● Live Binance';document.getElementById('live-indicator').className='text-[11px] text-accent-green self-center';}else{document.getElementById('live-indicator').textContent='● Live (sim)';document.getElementById('live-indicator').className='text-[11px] text-gold-400 self-center';priceInterval=setInterval(()=>{if(!currentAsset)return;tick(currentAsset.base+(Math.random()-0.48)*currentAsset.base*0.0015);},700);}}
function stopLive(){if(priceInterval){clearInterval(priceInterval);priceInterval=null;}if(ws){try{ws.close();}catch(e){}ws=null;}}
renderAssets();renderChips();
</script></body></html>
