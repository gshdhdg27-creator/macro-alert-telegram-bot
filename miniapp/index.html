<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Macro Alert</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,system-ui,sans-serif;background:#0b0e11;color:#eaecef}
.card{background:#12161c;border:1px solid #1e2329;border-radius:8px}
.tab-on{background:#1e2329;color:#f0b90b;font-weight:600}
.tf-on{color:#f0b90b;border-bottom:2px solid #f0b90b}
.up{color:#0ecb81}.dn{color:#f6465d}
#chart-wrap{width:100%;height:300px}
.news-img{width:100%;height:120px;object-fit:cover;border-radius:8px 8px 0 0;background:#1e2329}
.imp{width:10px;height:14px;border-radius:2px;display:inline-block;flex-shrink:0}
.imp-h{background:#f6465d}.imp-m{background:#f0b90b}.imp-l{background:#848e9c}.imp-hol{background:#3b82f6}
#app-asset{overflow-y:auto;-webkit-overflow-scrolling:touch}
.scroll-x{overflow-x:auto;scrollbar-width:none}
.ff-row{display:grid;grid-template-columns:52px 36px 14px 1fr;gap:6px;align-items:start;padding:10px 12px;border-bottom:1px solid #1e2329}
.ff-row:active{background:#12161c}
.ff-vals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:4px;font-size:10px;font-family:ui-monospace,monospace}
</style></head>
<body>
<div id="app-main" class="min-h-screen pb-20">
<header class="sticky top-0 z-40 bg-[#0b0e11]/95 border-b border-[#1e2329] px-3 py-2.5 flex justify-between items-center">
<div class="flex items-center gap-2"><div class="w-8 h-8 rounded-lg bg-[#f0b90b] flex items-center justify-center text-[#0b0e11] font-bold text-sm">M</div>
<div><div class="text-sm font-semibold">Macro Alert</div><div class="text-[10px] text-[#848e9c]">Forex Factory · Live</div></div></div>
<button id="btn-notif" onclick="toggleNotif()" class="text-xs px-2 py-1 border border-[#1e2329] rounded text-[#848e9c]">🔔</button>
</header>
<div class="px-3 pt-3">
<div class="flex gap-1 mb-3 bg-[#12161c] rounded-lg p-0.5">
<button onclick="switchTab('home')" id="tab-home" class="tab-on flex-1 py-2 rounded-md text-xs">Markets</button>
<button onclick="switchTab('news')" id="tab-news" class="flex-1 py-2 rounded-md text-xs text-[#848e9c]">News</button>
<button onclick="switchTab('settings')" id="tab-settings" class="flex-1 py-2 rounded-md text-xs text-[#848e9c]">Settings</button>
</div>
<div id="view-home">
<div class="card p-3 mb-3 flex justify-between"><div><div class="text-[10px] text-[#848e9c]">STATUS</div><div class="text-sm text-[#0ecb81]">● Online</div></div><div class="text-xs text-[#848e9c]">13 pairs</div></div>
<div id="assets-grid" class="space-y-1"></div>
</div>
<div id="view-news" class="hidden">
<div class="flex gap-1 mb-3 bg-[#12161c] rounded-lg p-0.5">
<button onclick="setNewsMode('calendar',this)" id="nm-calendar" class="tab-on flex-1 py-2 rounded-md text-xs">Calendar FF</button>
<button onclick="setNewsMode('stories',this)" id="nm-stories" class="flex-1 py-2 rounded-md text-xs text-[#848e9c]">Stories</button>
</div>
<div class="flex justify-between mb-2 items-center">
<div><div class="text-sm font-semibold" id="news-title">Forex Factory Calendar</div><div class="text-[10px] text-[#848e9c]" id="news-updated">…</div></div>
<button onclick="refreshNews()" class="text-xs px-2 py-1 border border-[#1e2329] rounded text-[#848e9c]">↻</button>
</div>
<div id="news-filters" class="flex gap-1 mb-2">
<button onclick="filterNews('all',this)" class="news-f tab-on px-2 py-1 rounded text-xs">All</button>
<button onclick="filterNews('High',this)" class="news-f px-2 py-1 rounded text-xs text-[#848e9c] bg-[#12161c]">High</button>
<button onclick="filterNews('Medium',this)" class="news-f px-2 py-1 rounded text-xs text-[#848e9c] bg-[#12161c]">Med</button>
<button onclick="filterNews('Low',this)" class="news-f px-2 py-1 rounded text-xs text-[#848e9c] bg-[#12161c]">Low</button>
</div>
<div class="card overflow-hidden mb-2">
<div class="ff-row text-[9px] text-[#848e9c] uppercase tracking-wide bg-[#0f1218]" style="border-bottom:1px solid #1e2329">
<span>Time</span><span>CCY</span><span></span><span>Event</span>
</div>
<div id="news-list"><p class="text-center text-[#848e9c] text-sm py-8">Loading…</p></div>
</div>
</div>
<div id="view-settings" class="hidden">
<div class="card p-3 mb-3 flex justify-between"><span class="text-sm">Notifications</span>
<button onclick="toggleNotif()" id="btn-notif2" class="text-xs text-[#0ecb81]">ON</button></div>
<div id="subscribe-chips" class="flex flex-wrap gap-1.5"></div>
</div>
</div></div>
<div id="app-asset" class="hidden fixed inset-0 z-50 bg-[#0b0e11]">
<div class="sticky top-0 z-20 bg-[#0b0e11] border-b border-[#1e2329]">
<div class="px-3 py-2 flex items-center gap-2">
<button onclick="closeAsset()" class="w-8 h-8 text-[#848e9c] text-lg">←</button>
<div class="flex-1"><div class="flex items-center gap-1"><span id="asset-symbol" class="font-semibold text-sm"></span><span class="text-[10px] text-[#848e9c]">/USDT</span>
<span id="asset-exchange" class="text-[9px] px-1 rounded bg-[#1e2329] text-[#848e9c]"></span></div>
<div id="asset-fullname" class="text-[10px] text-[#848e9c]"></div></div></div>
<div class="px-3 py-2 flex gap-4 border-t border-[#1e2329]">
<div><div id="asset-price" class="text-2xl font-semibold font-mono up">—</div><div id="asset-change" class="text-xs up">—</div></div>
<div class="flex-1 grid grid-cols-2 gap-x-2 text-[11px] content-center">
<div class="flex justify-between"><span class="text-[#848e9c]">High</span><span id="h24">—</span></div>
<div class="flex justify-between"><span class="text-[#848e9c]">Low</span><span id="l24">—</span></div>
</div></div>
<div class="px-2 flex scroll-x border-t border-[#1e2329]">
<button onclick="setTf(this,'1m')" class="tf-btn tf-on px-2.5 py-2 text-xs">1m</button>
<button onclick="setTf(this,'5m')" class="tf-btn px-2.5 py-2 text-xs text-[#848e9c]">5m</button>
<button onclick="setTf(this,'15m')" class="tf-btn px-2.5 py-2 text-xs text-[#848e9c]">15m</button>
<button onclick="setTf(this,'1h')" class="tf-btn px-2.5 py-2 text-xs text-[#848e9c]">1H</button>
<button onclick="setTf(this,'4h')" class="tf-btn px-2.5 py-2 text-xs text-[#848e9c]">4H</button>
<button onclick="setTf(this,'1d')" class="tf-btn px-2.5 py-2 text-xs text-[#848e9c]">1D</button>
<span id="live-indicator" class="ml-auto text-[11px] text-[#0ecb81] self-center pr-2">●</span>
</div>
<div class="px-3 py-1 border-t border-[#1e2329] flex gap-3 text-[11px] font-mono">
<span class="text-[#848e9c]">O <span id="ohlc-o">—</span></span>
<span class="text-[#848e9c]">H <span id="ohlc-h" class="up">—</span></span>
<span class="text-[#848e9c]">L <span id="ohlc-l" class="dn">—</span></span>
<span class="text-[#848e9c]">C <span id="ohlc-c">—</span></span>
</div></div>
<div class="pb-6"><div id="chart-wrap"></div></div>
</div>
<script>
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#0b0e11');tg.setBackgroundColor('#0b0e11');}catch(e){}}
const ASSETS=[{key:'btc',emoji:'₿',name:'BTC',full:'Bitcoin',binance:'BTCUSDT',base:80000,exchange:'Binance'},{key:'eth',emoji:'Ξ',name:'ETH',full:'Ethereum',binance:'ETHUSDT',base:3500,exchange:'Binance'},{key:'xauusd',emoji:'🟡',name:'XAUUSD',full:'Gold',binance:null,base:2650,exchange:'Market'},{key:'eurusd',emoji:'€',name:'EURUSD',full:'EUR/USD',binance:null,fx:'EUR',base:1.08,exchange:'FX'},{key:'gbpusd',emoji:'£',name:'GBPUSD',full:'GBP/USD',binance:null,fx:'GBP',base:1.30,exchange:'FX'},{key:'usdjpy',emoji:'¥',name:'USDJPY',full:'USD/JPY',binance:null,fx:'JPY',base:150,exchange:'FX',invert:true},{key:'nasdaq',emoji:'📈',name:'NASDAQ',full:'NASDAQ 100',binance:null,base:20500,exchange:'Index'},{key:'sp500',emoji:'📊',name:'S&P500',full:'S&P 500',binance:null,base:5800,exchange:'Index'},{key:'dxy',emoji:'💵',name:'DXY',full:'Dollar Index',binance:null,base:104,exchange:'Index'},{key:'oil',emoji:'🛢',name:'OIL',full:'Brent',binance:null,base:78,exchange:'Commodities'},{key:'agro',emoji:'🌾',name:'AGRO',full:'Agro',binance:null,base:580,exchange:'Commodities'},{key:'tesla',emoji:'🚗',name:'TSLA',full:'Tesla',binance:null,base:250,exchange:'US'},{key:'ai_tech',emoji:'🤖',name:'NVDA',full:'NVIDIA',binance:null,base:140,exchange:'US'}];
let notifOn=true,subscribed=Object.fromEntries(ASSETS.map(a=>[a.key,true]));
let currentAsset=null,chart=null,candleSeries=null,lineSeries=null,currentTf='1m';
let priceInterval=null,ws=null,candleData=[],lastCandle=null,allNews=[],calEvents=[],newsFilter='all',newsTimer=null,newsMode='calendar';
let sessionOpen=null,prevPrice=null,isLive=false,h24=0,l24=0,knownIds=new Set();
function fmt(p){if(p==null||isNaN(p))return'—';if(p>=10000)return p.toFixed(2);if(p>=100)return p.toFixed(2);if(p>=1)return p.toFixed(4);return p.toFixed(5);}
function fmtTime(iso){try{var d=new Date(iso);if(isNaN(d))return'—';return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});}catch(e){return'—';}}
function fmtDate(iso){try{var d=new Date(iso);if(isNaN(d))return'';return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}catch(e){return'';}}
function fmtDT(iso){try{var d=new Date(iso);if(isNaN(d))return iso||'—';return d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});}catch(e){return iso||'—';}}
function timeAgo(iso){try{var s=Math.floor((Date.now()-new Date(iso).getTime())/1000);if(s<0)return 'in '+Math.abs(Math.floor(s/60))+'m';if(s<60)return s+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}catch(e){return '';}}
function impactClass(imp){var i=(imp||'').toLowerCase();if(i==='high'||i==='red')return'imp-h';if(i==='medium'||i==='orange'||i==='med')return'imp-m';if(i==='holiday')return'imp-hol';return'imp-l';}
function renderAssets(){document.getElementById('assets-grid').innerHTML=ASSETS.map(a=>'<button onclick="openAsset(\''+a.key+'\')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left"><span class="text-lg w-7 text-center">'+a.emoji+'</span><div class="flex-1"><div class="text-sm font-medium">'+a.name+' <span class="text-[#848e9c] text-xs">/USDT</span></div><div class="text-[10px] text-[#848e9c]">'+a.full+(a.binance?' · Live':'')+'</div></div><div class="text-xs text-[#848e9c]">'+a.exchange+'</div></button>').join('');}
function renderChips(){document.getElementById('subscribe-chips').innerHTML=ASSETS.map(a=>'<button onclick="toggleSub(\''+a.key+'\')" class="px-2 py-1 rounded text-xs '+(subscribed[a.key]?'bg-[#f0b90b]/15 text-[#f0b90b] border border-[#f0b90b]/40':'bg-[#12161c] text-[#848e9c]')+'">'+a.name+'</button>').join('');}
function switchTab(tab){['home','news','settings'].forEach(t=>{var v=document.getElementById('view-'+t);if(v)v.classList.toggle('hidden',t!==tab);var b=document.getElementById('tab-'+t);if(b)b.className=(t===tab?'tab-on':'text-[#848e9c]')+' flex-1 py-2 rounded-md text-xs';});if(tab==='news'){refreshNews();if(newsTimer)clearInterval(newsTimer);newsTimer=setInterval(refreshNews,30000);}else if(newsTimer){clearInterval(newsTimer);newsTimer=null;}}
function toggleNotif(){notifOn=!notifOn;document.getElementById('btn-notif').textContent=notifOn?'🔔':'🔇';var b2=document.getElementById('btn-notif2');if(b2){b2.textContent=notifOn?'ON':'OFF';b2.className='text-xs '+(notifOn?'text-[#0ecb81]':'text-[#f6465d]');}try{localStorage.setItem('macro_notif',notifOn?'1':'0');}catch(e){}}
function toggleSub(k){subscribed[k]=!subscribed[k];renderChips();}
function setNewsMode(mode,btn){newsMode=mode;document.getElementById('nm-calendar').className=(mode==='calendar'?'tab-on':'text-[#848e9c]')+' flex-1 py-2 rounded-md text-xs';document.getElementById('nm-stories').className=(mode==='stories'?'tab-on':'text-[#848e9c]')+' flex-1 py-2 rounded-md text-xs';document.getElementById('news-title').textContent=mode==='calendar'?'Forex Factory Calendar':'News Stories';document.getElementById('news-filters').style.display=mode==='calendar'?'flex':'none';refreshNews();}
async function refreshNews(){if(newsMode==='calendar')await loadCalendar();else await loadStories();}
async function loadCalendar(){var list=document.getElementById('news-list');try{var data=null,src='';try{var r=await fetch('https://pipatlas.com/api/calendar?t='+Date.now(),{cache:'no-store'});if(r.ok){var j=await r.json();data=j.events||j||[];src='Forex Factory';}}catch(e){}if(!data||!data.length){try{var r2=await fetch('https://nfs.faireconomy.media/ff_calendar_thisweek.json?t='+Date.now(),{cache:'no-store'});if(r2.ok){data=await r2.json();src='FF feed';}}catch(e){}}if(!Array.isArray(data))data=[];calEvents=data.map(function(e){return{id:(e.name||e.title||'')+(e.date||''),title:e.name||e.title||'',currency:e.currency||e.country||'',impact:e.impact||'Low',date:e.date||'',forecast:e.forecast||'',previous:e.previous||'',actual:e.actual||'',url:e.url||''};});var n=0;calEvents.forEach(function(e){if(e.id&&!knownIds.has(e.id)){knownIds.add(e.id);n++;}});document.getElementById('news-updated').textContent=calEvents.length+' events · '+src+(n?' · +'+n+' new':'')+' · '+fmtDT(new Date().toISOString());renderCalendar();}catch(e){list.innerHTML='<p class="text-[#f6465d] text-center py-6">Load error</p>';}}
function renderCalendar(){var list=document.getElementById('news-list');var items=newsFilter==='all'?calEvents:calEvents.filter(function(e){var i=(e.impact||'').toLowerCase();if(newsFilter==='High')return i==='high'||i==='red';if(newsFilter==='Medium')return i==='medium'||i==='orange'||i==='med';if(newsFilter==='Low')return i==='low'||i==='yellow'||i==='holiday';return true;});items=items.slice().sort(function(a,b){return new Date(a.date)-new Date(b.date);});if(!items.length){list.innerHTML='<p class="text-center text-[#848e9c] py-8">No events</p>';return;}var lastDay='';list.innerHTML=items.map(function(e){var day=fmtDate(e.date);var head=day!==lastDay?'<div class="px-3 py-1.5 text-[10px] text-[#f0b90b] bg-[#0f1218] border-b border-[#1e2329] font-semibold">'+day+'</div>':'';lastDay=day;var ic=impactClass(e.impact);var act=e.actual||'—',fc=e.forecast||'—',prev=e.previous||'—';return head+'<div class="ff-row text-left"><span class="text-[11px] font-mono text-[#eaecef]">'+fmtTime(e.date)+'</span><span class="text-[11px] font-semibold text-[#f0b90b]">'+(e.currency||'')+'</span><span class="imp '+ic+'" title="'+(e.impact||'')+'"></span><div><div class="text-[12px] leading-snug">'+(e.title||'')+'</div><div class="ff-vals"><div><span class="text-[#848e9c]">Act </span>'+act+'</div><div><span class="text-[#848e9c]">Fcst </span>'+fc+'</div><div><span class="text-[#848e9c]">Prev </span>'+prev+'</div></div></div></div>';}).join('');}
async function loadStories(){var list=document.getElementById('news-list');list.innerHTML='<p class="text-center text-[#848e9c] py-6">Loading…</p>';try{var items=[];var feeds=['https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent('https://feeds.bbci.co.uk/news/business/rss.xml')+'&count=20'];for(var i=0;i<feeds.length;i++){try{var r=await fetch(feeds[i]+'&_='+Date.now(),{cache:'no-store'});var j=await r.json();if(j.status==='ok'&&j.items)items=items.concat(j.items);}catch(e){}}var seen={};allNews=items.filter(function(it){var t=it.title||'';if(seen[t])return false;seen[t]=1;return true;}).map(function(it){var img='';if(it.enclosure&&it.enclosure.link)img=it.enclosure.link;else if(it.thumbnail)img=it.thumbnail;else if(it.content&&/src="([^"]+)"/.test(it.content))img=RegExp.$1;return{id:it.guid||it.link||it.title,title:it.title||'',link:it.link||'',date:it.pubDate||'',source:it.author||'BBC',desc:(it.description||'').replace(/<[^>]+>/g,'').slice(0,140),image:img};});allNews.sort(function(a,b){return new Date(b.date)-new Date(a.date);});document.getElementById('news-updated').textContent=allNews.length+' stories · '+fmtDT(new Date().toISOString());renderStories();}catch(e){list.innerHTML='<p class="text-[#f6465d] text-center py-6">Error</p>';}}
function renderStories(){var list=document.getElementById('news-list');if(!allNews.length){list.innerHTML='<p class="text-center py-8 text-[#848e9c]">No stories</p>';return;}list.innerHTML='<div class="space-y-3 p-2">'+allNews.map(function(e){var img=e.image?'<img class="news-img" src="'+e.image+'" loading="lazy" onerror="this.style.display=\'none\'"/>':'';return '<a href="'+(e.link||'#')+'" target="_blank" rel="noopener" class="card overflow-hidden block text-left">'+img+'<div class="p-3"><div class="flex text-[10px] text-[#848e9c] mb-1"><span class="text-[#f0b90b]">'+(e.source||'')+'</span><span class="ml-auto font-mono">'+fmtDT(e.date)+'</span></div><div class="text-sm font-semibold mb-1">'+(e.title||'')+'</div><div class="text-[10px] text-[#848e9c]">'+timeAgo(e.date)+'</div></div></a>';}).join('')+'</div>';}
function filterNews(level,btn){newsFilter=level;document.querySelectorAll('.news-f').forEach(function(b){b.className='news-f px-2 py-1 rounded text-xs text-[#848e9c] bg-[#12161c]';});if(btn)btn.className='news-f tab-on px-2 py-1 rounded text-xs';if(newsMode==='calendar')renderCalendar();}
function openAsset(key){currentAsset=ASSETS.find(a=>a.key===key);if(!currentAsset)return;document.getElementById('app-main').classList.add('hidden');var v=document.getElementById('app-asset');v.classList.remove('hidden');v.scrollTop=0;document.getElementById('asset-symbol').textContent=currentAsset.name;document.getElementById('asset-fullname').textContent=currentAsset.full;document.getElementById('asset-exchange').textContent=currentAsset.exchange;sessionOpen=null;prevPrice=null;lastCandle=null;candleData=[];isLive=false;h24=0;l24=0;if(tg){try{tg.BackButton.show();tg.BackButton.onClick(closeAsset);}catch(e){}}initChart();loadChartData().then(function(){startLive();});}
function closeAsset(){stopLive();if(chart){try{chart.remove();}catch(e){}chart=null;}candleSeries=lineSeries=null;document.getElementById('app-asset').classList.add('hidden');document.getElementById('app-main').classList.remove('hidden');if(tg)try{tg.BackButton.hide();}catch(e){}}
function sanitize(data){if(!data||!data.length)return[];var out=[],lastT=-1;for(var i=0;i<data.length;i++){var c=data[i],t=Math.floor(Number(c.time));if(!t||t<=lastT)continue;var o=+c.open,h=+c.high,l=+c.low,cl=+c.close;if(!(o>0&&h>0&&l>0&&cl>0))continue;if(h<Math.max(o,cl))h=Math.max(o,cl);if(l>Math.min(o,cl))l=Math.min(o,cl);out.push({time:t,open:o,high:h,low:l,close:cl});lastT=t;}return out;}
function initChart(){var el=document.getElementById('chart-wrap');el.innerHTML='';el.style.height='300px';chart=LightweightCharts.createChart(el,{width:el.clientWidth||window.innerWidth,height:300,layout:{background:{type:'solid',color:'#0b0e11'},textColor:'#848e9c',fontSize:10},grid:{vertLines:{color:'#1e2329'},horzLines:{color:'#1e2329'}},rightPriceScale:{borderColor:'#1e2329'},timeScale:{borderColor:'#1e2329',timeVisible:true,rightOffset:6,barSpacing:7},crosshair:{mode:0},handleScroll:{vertTouchDrag:false}});candleSeries=chart.addCandlestickSeries({upColor:'#0ecb81',downColor:'#f6465d',borderUpColor:'#0ecb81',borderDownColor:'#f6465d',wickUpColor:'#0ecb81',wickDownColor:'#f6465d'});lineSeries=chart.addLineSeries({color:'#f0b90b',lineWidth:2,visible:false});}
function tfSec(tf){return{'1m':60,'5m':300,'15m':900,'1h':3600,'4h':14400,'1d':86400}[tf]||60;}
function tfBin(tf){return{'1m':'1m','5m':'5m','15m':'15m','1h':'1h','4h':'4h','1d':'1d'}[tf]||'1m';}
function genCandles(base,n,sec){var now=Math.floor(Date.now()/1000),aligned=Math.floor(now/sec)*sec,data=[],price=base*(0.997+Math.random()*0.006),trend=0;for(var i=n;i>=0;i--){var t=aligned-i*sec,o=price;trend=trend*0.9+(Math.random()-0.5)*0.0004;var cl=o+o*trend;var wr=Math.abs(cl-o)*0.7+o*0.0003;data.push({time:t,open:o,high:Math.max(o,cl)+Math.random()*wr,low:Math.min(o,cl)-Math.random()*wr,close:cl});price=cl;}return sanitize(data);}
async function loadBinance(symbol,interval,limit){try{var res=await fetch('https://data-api.binance.vision/api/v3/klines?symbol='+symbol+'&interval='+interval+'&limit='+limit,{cache:'no-store'});if(!res.ok)return null;var raw=await res.json();if(!Array.isArray(raw)||raw.length<3)return null;return sanitize(raw.map(function(k){return{time:Math.floor(k[0]/1000),open:+k[1],high:+k[2],low:+k[3],close:+k[4]};}));}catch(e){return null;}}
async function loadChartData(){if(!currentAsset||!chart)return;var data=null;document.getElementById('live-indicator').textContent='⏳';if(currentAsset.binance){data=await loadBinance(currentAsset.binance,tfBin(currentTf),150);if(data&&data.length){currentAsset.base=data[data.length-1].close;document.getElementById('live-indicator').textContent='● Binance';document.getElementById('live-indicator').className='ml-auto text-[11px] text-[#0ecb81] self-center pr-2';}}if(!data||data.length<5){if(currentAsset.fx){try{var r=await fetch('https://api.exchangerate-api.com/v4/latest/USD');var j=await r.json();if(j&&j.rates&&j.rates[currentAsset.fx]){var rate=j.rates[currentAsset.fx];currentAsset.base=currentAsset.invert?(1/rate):rate;}}catch(e){}}data=genCandles(currentAsset.base,120,tfSec(currentTf));document.getElementById('live-indicator').textContent='● Live';document.getElementById('live-indicator').className='ml-auto text-[11px] text-[#f0b90b] self-center pr-2';}candleData=data;var last=data[data.length-1];lastCandle={time:last.time,open:last.open,high:last.high,low:last.low,close:last.close};sessionOpen=data[0].open;prevPrice=last.close;h24=Math.max.apply(null,data.map(function(c){return c.high;}));l24=Math.min.apply(null,data.map(function(c){return c.low;}));candleSeries.setData(candleData);lineSeries.setData(candleData.map(function(c){return{time:c.time,value:c.close};}));updateUI(last.close);updateOHLC(lastCandle);document.getElementById('h24').textContent=fmt(h24);document.getElementById('l24').textContent=fmt(l24);chart.timeScale().fitContent();}
function updateUI(price){var el=document.getElementById('asset-price');el.textContent=fmt(price);var up=prevPrice==null||price>=prevPrice;el.className='text-2xl font-semibold font-mono '+(up?'up':'dn');var base=sessionOpen||price;var pct=((price-base)/base*100);var ch=document.getElementById('asset-change');ch.textContent=(pct>=0?'+':'')+pct.toFixed(2)+'%';ch.className='text-xs '+(pct>=0?'up':'dn');prevPrice=price;}
function updateOHLC(c){if(!c)return;var up=c.close>=c.open;document.getElementById('ohlc-o').textContent=fmt(c.open);document.getElementById('ohlc-h').textContent=fmt(c.high);document.getElementById('ohlc-l').textContent=fmt(c.low);var cc=document.getElementById('ohlc-c');cc.textContent=fmt(c.close);cc.className=up?'up':'dn';if(c.high>h24){h24=c.high;document.getElementById('h24').textContent=fmt(h24);}if(c.low<l24||!l24){l24=c.low;document.getElementById('l24').textContent=fmt(l24);}}
function setTf(btn,tf){currentTf=tf;document.querySelectorAll('.tf-btn').forEach(function(b){b.className='tf-btn px-2.5 py-2 text-xs text-[#848e9c]';});btn.className='tf-btn tf-on px-2.5 py-2 text-xs';stopLive();loadChartData().then(function(){startLive();});}
function applyTick(price){if(!candleSeries||!lastCandle||!(price>0)||!isLive)return;currentAsset.base=price;updateUI(price);var sec=tfSec(currentTf),now=Math.floor(Date.now()/1000);var ct=Math.floor(now/sec)*sec;if(ct<lastCandle.time)ct=lastCandle.time;if(ct>lastCandle.time){lastCandle={time:ct,open:price,high:price,low:price,close:price};candleData.push(lastCandle);}else{lastCandle.close=price;if(price>lastCandle.high)lastCandle.high=price;if(price<lastCandle.low)lastCandle.low=price;}try{candleSeries.update(lastCandle);lineSeries.update({time:lastCandle.time,value:lastCandle.close});updateOHLC(lastCandle);}catch(e){}}
function startLive(){stopLive();if(!lastCandle||!currentAsset)return;isLive=true;if(currentAsset.binance){try{ws=new WebSocket('wss://data-stream.binance.vision/ws/'+currentAsset.binance.toLowerCase()+'@trade');ws.onmessage=function(ev){try{var j=JSON.parse(ev.data);if(j&&j.p)applyTick(parseFloat(j.p));}catch(e){}};ws.onerror=function(){fallbackPoll();};ws.onclose=function(){if(isLive)fallbackPoll();};}catch(e){fallbackPoll();}}else{priceInterval=setInterval(function(){if(!isLive||!currentAsset)return;applyTick(currentAsset.base*(1+(Math.random()-0.5)*0.0002));},800);}}
function fallbackPoll(){if(priceInterval)clearInterval(priceInterval);priceInterval=setInterval(async function(){if(!isLive||!currentAsset||!currentAsset.binance)return;try{var r=await fetch('https://data-api.binance.vision/api/v3/ticker/price?symbol='+currentAsset.binance,{cache:'no-store'});var j=await r.json();if(j&&j.price)applyTick(parseFloat(j.price));}catch(e){}},1000);}
function stopLive(){isLive=false;if(priceInterval){clearInterval(priceInterval);priceInterval=null;}if(ws){try{ws.close();}catch(e){}ws=null;}}
function boot(){try{if(localStorage.getItem('macro_notif')==='0')notifOn=false;document.getElementById('btn-notif').textContent=notifOn?'🔔':'🔇';renderAssets();renderChips();}catch(e){}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script></body></html>
